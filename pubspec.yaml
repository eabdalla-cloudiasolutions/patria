name: erb
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.4
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  carousel_slider: ^5.1.2
  curved_navigation_bar: ^1.0.6
  persistent_bottom_nav_bar: ^6.2.1
  shimmer: ^3.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  lottie: ^3.3.2
  geocoding: ^4.0.0
  timelines_plus: ^2.0.0
  easy_localization: ^3.0.8
  flutter_localization: ^0.3.3
  package_info_plus: ^9.0.0
  flutter_screenutil: ^5.9.3
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  provider: ^6.1.5+1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  equatable: ^2.0.8
  flutter_facebook_auth: ^7.1.6
  intl: ^0.20.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  socket_io_client: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  rename: ^3.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/splash.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/translations/ 


  fonts:
  - family: Montserrat
    fonts:
      - asset: assets/fonts/Montserrat-Regular.ttf
        weight: 400
      - asset: assets/fonts/Montserrat-Medium.ttf
        weight: 500
      - asset: assets/fonts/Montserrat-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Montserrat-Bold.ttf
        weight: 700
      - asset: assets/fonts/Montserrat-Light.ttf
        weight: 300
      - asset: assets/fonts/Montserrat-ExtraBold.ttf
        weight: 800
 